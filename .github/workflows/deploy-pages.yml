# Builds each project folder and publishes them to GitHub Pages.
# Address: https://harbor-k.github.io/landing_page/<folder>/
# To add a project (gamecove, utrada, eto-markets), add its folder name to PROJECTS below.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PROJECTS: "trust-bank"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build projects
        run: |
          mkdir -p _site
          for p in $PROJECTS; do
            (cd "$p" && npm ci && npm run build)
            mkdir -p "_site/$p"
            cp -r "$p/dist/." "_site/$p/"
          done
          # the bare address opens the Trust Bank page for now
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./trust-bank/"><a href="./trust-bank/">Trust Bank</a>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
